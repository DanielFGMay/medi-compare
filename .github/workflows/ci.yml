name: CI

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]

jobs:
  # Backend CI
  backend:
    runs-on: ubuntu-latest
    working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B verify --fail-fast
      env:
        MAVEN_OPTS: '-Xmx2g'

    - name: Test with Maven
      run: mvn test

  # Frontend CI
  frontend:
    runs-on: ubuntu-latest
    working-directory: ./frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run build
      run: npm run build

    - name: Run linting
      run: npm run lint

  # Multi-platform build
  build:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate SBOM
      uses: actions/sbom-generate@v1