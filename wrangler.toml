# Cloudflare Pages configuration for Farmacompara Frontend
# This is a STATIC SPA (React + Vite), NOT a Worker
# Deploy with: npx wrangler pages deploy .
# Or use Cloudflare Pages dashboard with build command: npm install --prefix frontend && npm run build --prefix frontend
# Output directory: frontend/dist

name = "farmacompara-frontend"
main = "frontend/dist/index.html"

[build]
command = "npm install --prefix frontend && npm run build --prefix frontend"
cwd = "."
watch_dir = "frontend/src"

[build.environment]
NODE_VERSION = "20"

# Pages-specific configuration for static assets
[pages]
build_output_dir = "frontend/dist"

# Assets configuration for static site
[pages.assets]
directory = "frontend/dist"
html = "index.html"